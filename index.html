<!DOCTYPE html>
<!-- Vorgabe der App ist Deutsch; `starteSprache()` hebt das Attribut vor
     dem Mount auf die gespeicherte Sprache. -->
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05080a">
    <title>AutarkTrade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Installierbar als Web-App (eigenes Fenster) – nur über HTTPS, sonst Verknüpfung mit Name und Symbol -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AutarkTrade">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
