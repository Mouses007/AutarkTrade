services:
  journal:
    image: autarktrade:latest
    container_name: autarktrade
    ports:
      # ACHTUNG: ohne "127.0.0.1:"-Präfix ist der Port im ganzen LAN erreichbar.
      # Das ist eine bewusste Freigabe und setzt das Passwort-Gate voraus —
      # ohne Passwort startet der Container gesperrt (erst „Passwort festlegen"
      # im Browser schaltet die API frei; bewusst offen: AT_ALLOW_INSECURE=1).
      # Nur lokal am Host: - "127.0.0.1:${AT_PORT:-8080}:8080"
      - "${AT_PORT:-8080}:8080"
    environment:
      - AT_SECRET=${AT_SECRET}
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Absoluter Host-Pfad zum Projekt-Dir (muss in .env gesetzt sein).
      # Der App-Update-Button im Docker-Modus uebergibt diesen Pfad an
      # den Helfer-Container, damit compose das richtige Projekt findet.
      - AT_HOST_COMPOSE_DIR=${AT_HOST_COMPOSE_DIR}
      # Hinter Caddy tragen alle Klienten dieselbe Peer-IP — der Login-
      # Fehlversuchs-Zähler würde zu EINEM Eimer kollabieren und fremde
      # Fehlversuche sperrten den Eigentümer aus. Mit =1 liest NUR dieser
      # Zähler die vom Proxy angehängte X-Forwarded-For-Adresse; alle
      # anderen Prüfungen (isLocalRequest) bleiben bei der Peer-IP.
      # Seit F2 (Audit A2-03) zählt der Kopf NUR, wenn die Verbindung von
      # AT_TRUSTED_PROXY kommt (Namen oder IPs, Komma-getrennt; Vorgabe: die
      # Compose-Namen caddy,autarktrade-caddy). Wer 8080 direkt anspricht,
      # kann sich damit keine neue Adresse je Versuch mehr ausdenken. Heisst
      # der Caddy-Dienst anders (Synology-Projekt), hier seinen Namen eintragen.
      - AT_TRUST_PROXY=${AT_TRUST_PROXY:-1}
      - AT_TRUSTED_PROXY=${AT_TRUSTED_PROXY:-caddy,autarktrade-caddy}
    # Kein Docker-Socket mehr in der Vorgabe (Audit A2-10, F2 20.10.2026).
    # Er war root-äquivalent auf dem Host und brachte nichts: das Klick-Update
    # verlangt eine Anfrage von localhost, und im Container ist der Peer nie
    # localhost — der Knopf antwortete dort immer 403. Updates im Container:
    #   docker compose pull && docker compose up -d
    # Die App läuft im Container als Benutzer `node`, nicht als root.
    env_file:
      - .env
    restart: unless-stopped

  # TLS-Termination für den LAN-Zugriff (siehe Caddyfile + DOCKER.md). Rein
  # additiv: "journal" bleibt unverändert per HTTP auf AT_PORT erreichbar
  # (u.a. für das ESP32-Display, das kein TLS spricht) — Caddy kommt als
  # zweiter, unabhängiger Eingang dazu, erreicht "journal" über den internen
  # Compose-Netzwerknamen.
  caddy:
    image: caddy:2-alpine
    container_name: autarktrade-caddy
    ports:
      # 443 ist auf der NAS bereits durch die DSM (nginx) belegt, deshalb ein
      # eigener Port statt des HTTPS-Standardports.
      - "${AT_TLS_PORT:-8443}:443"
    environment:
      # Wohin Caddy weiterreicht. Hier heisst der Service "journal"; im Projekt
      # des Synology Container Managers heisst er "trading-journal" — dort also
      # AT_UPSTREAM=trading-journal:8080 setzen.
      - AT_UPSTREAM=${AT_UPSTREAM:-journal:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - journal
    restart: unless-stopped

volumes:
  caddy_data:

# Auto-Updates (Watchtower) sind bewusst NICHT Teil dieses Compose-Files.
# Updates: "docker compose pull && docker compose up -d" auf dem Host.
# Wer einen Background-Poller will, kann Watchtower separat starten (der
# bekommt dann den Socket — nicht die App):
#   docker run -d --name watchtower-journal \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     -e WATCHTOWER_POLL_INTERVAL=3600 -e WATCHTOWER_CLEANUP=true \
#     containrrr/watchtower autarktrade
