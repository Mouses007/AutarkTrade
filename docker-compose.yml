services:
  journal:
    # Fertiges Image aus der öffentlichen Registry (Update: docker compose pull && docker compose up -d).
    # Wer lieber selbst baut: docker compose up -d --build (baut aus diesem Ordner).
    image: ghcr.io/mouses007/autarktrade:latest
    build: .
    container_name: autarktrade
    ports:
      # ACHTUNG: ohne "127.0.0.1:"-Präfix ist der Port im ganzen LAN erreichbar.
      # Das ist eine bewusste Freigabe und setzt das Passwort-Gate voraus —
      # ohne Passwort startet der Container gesperrt (erst „Passwort festlegen"
      # im Browser schaltet die API frei; bewusst offen: AT_ALLOW_INSECURE=1).
      # Nur lokal am Host: - "127.0.0.1:${AT_PORT:-8080}:8080"
      - "${AT_PORT:-8080}:8080"
      # HTTPS macht die App selbst (eigene CA, Zertifikat in der Datenbank —
      # DOCKER.md, Abschnitt HTTPS). 443 ist auf einer Synology belegt, daher 8443.
      - "${AT_TLS_PORT:-8443}:8443"
    environment:
      - AT_SECRET=${AT_SECRET}
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Absoluter Host-Pfad zum Projekt-Dir (muss in .env gesetzt sein).
      # Der App-Update-Button im Docker-Modus uebergibt diesen Pfad an
      # den Helfer-Container, damit compose das richtige Projekt findet.
      - AT_HOST_COMPOSE_DIR=${AT_HOST_COMPOSE_DIR}
      # HTTPS-Port IM Container: immer 8443 (das Mapping oben bestimmt den
      # Host-Port über AT_TLS_PORT in der .env). Abschalten: hier `aus` und
      # die Mapping-Zeile entfernen.
      - AT_TLS_PORT=8443
      # Zusätzliche Namen/IPs fürs Zertifikat (Komma-Liste), vor allem die
      # Adresse des Hosts — die kennt die App im Container nicht. Ohne Eintrag
      # schlägt die Oberfläche die Adressen vor, unter denen sie aufgerufen wurde.
      - AT_TLS_NAMEN=${AT_TLS_NAMEN:-}
      # Kein Proxy davor: X-Forwarded-For zählt nicht (Login-Sperre nach
      # Peer-IP). Nur wer selbst einen Reverse-Proxy vorschaltet, setzt
      # AT_TRUST_PROXY=1 und AT_TRUSTED_PROXY=<Name des Proxy-Dienstes>.
      - AT_TRUST_PROXY=${AT_TRUST_PROXY:-0}
    # Kein Docker-Socket mehr in der Vorgabe (Audit A2-10, F2 20.10.2026).
    # Er war root-äquivalent auf dem Host und brachte nichts: das Klick-Update
    # verlangt eine Anfrage von localhost, und im Container ist der Peer nie
    # localhost — der Knopf antwortete dort immer 403. Updates im Container:
    #   docker compose pull && docker compose up -d
    # Die App läuft im Container als Benutzer `node`, nicht als root.
    env_file:
      - .env
    volumes:
      # Datenordner: SQLite-Datei (DB_TYPE=sqlite) und die vom Einstieg erzeugte
      # db-config.json. Ohne Volume ginge ein SQLite-Bestand beim Neuerstellen
      # verloren (Audit SEC-OPS-014). Bei PostgreSQL liegt hier nur die Konfiguration.
      - autarktrade_data:/app/data
    # Härtung (Audit SEC-OPS-005): keine neuen Rechte über setuid-Programme und nur
    # die Fähigkeiten, die der Einstieg als root braucht — ein altes Volume übernehmen
    # (CHOWN, FOWNER, DAC_OVERRIDE) und die Rechte an `node` abgeben (SETUID, SETGID).
    # Die App selbst läuft danach als `node` ganz ohne Fähigkeiten. `read_only` bleibt
    # vorerst aus: die Strategie-Ablage (server/strategies) wird zur Laufzeit beschrieben,
    # und ein schreibgeschütztes Wurzeldateisystem ist am Gerät noch nicht erprobt.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    restart: unless-stopped

volumes:
  autarktrade_data:

# Auto-Updates (Watchtower) sind bewusst NICHT Teil dieses Compose-Files.
# Updates: "docker compose pull && docker compose up -d" auf dem Host.
# Wer einen Background-Poller will, kann Watchtower separat starten (der
# bekommt dann den Socket — nicht die App):
#   docker run -d --name watchtower-journal \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     -e WATCHTOWER_POLL_INTERVAL=3600 -e WATCHTOWER_CLEANUP=true \
#     containrrr/watchtower autarktrade
