# AutarkTrade (V2) im Container-Manager-Projekt `tradingjournal` der NAS (U1).
#
# Ersetzt die docker-compose.yml der alten App im SELBEN Projekt: gleiche .env,
# gleicher Port, gleicher Caddy, gleiche Datenbank — nur das Image ist neu.
# Das Image heisst lokal `autarktrade:produktiv`, kommt per SSH (scripts/umzug/
# nas-deploy.sh) und wird NIE gezogen (`pull_policy: never`): weder vom alten
# öffentlichen Docker-Hub-Image noch aus einer anderen Registry.
#
# Keine `container_name`-Zeilen: Compose benennt selbst
# (tradingjournal-trading-journal-1, tradingjournal-caddy-1), und der Container-
# Manager kann das Projekt ohne Namenskonflikt neu erstellen.
#
# Die Werte (DB-Zugang, Secret, Ports) stehen in der .env des Projekts und
# bleiben, wie sie sind. AutarkTrade liest CTJ_* weiter (server/umgebung.js),
# also auch CTJ_SECRET — die verschlüsselten Börsenschlüssel bleiben lesbar.
services:
  trading-journal:
    image: ${AT_IMAGE:-autarktrade:produktiv}
    pull_policy: never
    ports:
      # Wie bisher: im LAN offen (ESP32 spricht kein TLS), Passwort-Gate an.
      # (AT_BIND_IP nur für den Probelauf: 127.0.0.1; auf der NAS nicht setzen)
      - "${AT_BIND_IP:-0.0.0.0}:${CTJ_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # KEIN Testbetrieb: Takte, Mails, Push, Engine (nur Simulation, S13) und
      # Rekorder laufen. Ausdrücklich gesetzt, damit kein alter CTJ_-Wert greift.
      # (Engine/Rekorder abschalten nur für den Probelauf über die .env.)
      - AT_TESTBETRIEB=0
      - AT_NO_ENGINE=${AT_NO_ENGINE:-0}
      - AT_NO_RECORDER=${AT_NO_RECORDER:-0}
      # Sicherheitsschalter ausdrücklich: leer = aus, und ein altes
      # CTJ_ALLOW_INSECURE/CTJ_RESET_AUTH in der .env wirkt NICHT mehr (A2-30).
      - AT_ALLOW_INSECURE=
      - AT_RESET_AUTH=
      # Fehlversuchs-Zähler hinter Caddy: der Kopf zählt nur vom Dienst `caddy` (A2-03).
      - AT_TRUST_PROXY=1
      - AT_TRUSTED_PROXY=caddy
      # Name, unter dem die App im LAN erreichbar ist (Dienst `mdns` unten kündigt ihn an);
      # der Host-Schutz gibt genau diesen Namen frei. Leer oder „aus" = kein eigener Name.
      - AT_MDNS_NAME=${AT_MDNS_NAME:-autarktrade.local}
    # Kein Docker-Socket (A2-10). Die App läuft als `node` (uid 1000); ein
    # bestehendes /app/data-Volume übernimmt der Einstieg selbst (chown).
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${AT_BIND_IP:-0.0.0.0}:${CTJ_TLS_PORT:-8443}:443"
    environment:
      # Die Caddyfile der NAS ist die alte (CTJ_UPSTREAM), die von V2 liest
      # AT_UPSTREAM — beide zeigen auf den App-Dienst.
      - CTJ_UPSTREAM=trading-journal:8080
      - AT_UPSTREAM=trading-journal:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - trading-journal
    restart: unless-stopped

  # Eigener Name im LAN ohne Router-Eintrag und ohne die NAS umzubenennen:
  # beantwortet mDNS-Fragen nach AT_MDNS_NAME mit der IPv4 der NAS
  # (server/mdns-name.mjs). Braucht das echte Netz für Multicast, daher host.
  # Adresse automatisch (private IPv4), sonst AT_MDNS_IP in der .env setzen.
  mdns:
    image: ${AT_IMAGE:-autarktrade:produktiv}
    pull_policy: never
    network_mode: host
    command: ["node", "server/mdns-name.mjs"]
    environment:
      - AT_MDNS_NAME=${AT_MDNS_NAME:-autarktrade.local}
      - AT_MDNS_IP=${AT_MDNS_IP:-}
    restart: unless-stopped

volumes:
  caddy_data:
