name: Docker publish

# Baut das Container-Image von AutarkTrade.
#
# Übergangsstand (S2 „Fundament V2"): NUR von Hand startbar und NUR in die
# GitHub-Registry (ghcr.io, bei einem privaten Repo privat). Das alte Projekt
# veröffentlichte bei jedem v*-Tag auch auf dem öffentlichen Docker Hub — für
# ein Produkt unter eigener Lizenz wäre das eine ungewollte Veröffentlichung.
# Die endgültige Registry richtet S11 „Herkunftsnachweis & Freigabe" ein.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tags und Beschriftungen ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mouses007/autarktrade
          flavor: latest=false
          tags: |
            type=raw,value=edge
          labels: |
            org.opencontainers.image.title=AutarkTrade
            org.opencontainers.image.description=AutarkTrade – Trading-Journal und Analyse-Arbeitsplatz für Krypto-Futures
            org.opencontainers.image.licenses=LicenseRef-AutarkTrade-proprietary

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
