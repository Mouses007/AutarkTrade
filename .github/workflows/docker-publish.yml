name: Docker publish

# Baut das Container-Image von AutarkTrade.
#
# Ziel ist die GitHub-Registry ghcr.io/mouses007/autarktrade. AutarkTrade ist
# freie Software (AGPL-3.0); das Paket ist öffentlich, jeder kann es ohne Token
# ziehen. Kein Docker Hub mehr — dort liegt nur noch das alte Crypto Trading Journal.
#
#   von Hand (Actions → Run workflow)  → :edge        zum Ausprobieren
#   Tag v4.1.0                         → :4.1.0, :4.1, :latest
#
# Der Update-Knopf im Container zieht das Image, mit dem der Container läuft
# (in der Regel :latest). Vorabversionen (Tag mit „-", z. B. v4.1.0-beta.1)
# bekommen kein :latest.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tags und Beschriftungen ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mouses007/autarktrade
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=AutarkTrade
            org.opencontainers.image.description=AutarkTrade – Trading-Journal und Analyse-Arbeitsplatz für Krypto-Futures
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
