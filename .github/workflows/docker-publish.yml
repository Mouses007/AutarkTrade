name: Docker publish

# Baut das Container-Image von AutarkTrade.
#
# Ziel ist ausschliesslich die GitHub-Registry ghcr.io/mouses007/autarktrade.
# Das Paket gehört zum privaten Repo und ist damit privat: ziehen kann nur, wer
# ein Token mit `read:packages` hat (Kunden über den `zugang` im Lizenzschlüssel,
# server/update-api.js). Kein Docker Hub — ein öffentliches Image wäre eine
# Weitergabe ohne Lizenz.
#
#   von Hand (Actions → Run workflow)  → :edge        zum Ausprobieren
#   Tag v4.1.0                         → :4.1.0, :4.1, :latest
#
# Der Update-Knopf im Container zieht das Image, mit dem der Container läuft
# (in der Regel :latest), und nur, wenn das Release vor `updatesBis` erschien.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tags und Beschriftungen ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mouses007/autarktrade
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=AutarkTrade
            org.opencontainers.image.description=AutarkTrade – Trading-Journal und Analyse-Arbeitsplatz für Krypto-Futures
            org.opencontainers.image.licenses=LicenseRef-AutarkTrade-proprietary

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
